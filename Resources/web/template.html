<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <!-- Rendered Markdown is untrusted (html: true). Scripts load only from the
         app bundle, so inline handlers, javascript: URLs and workspace .js files
         never run; nothing but https images (and media) leaves the machine.
         Quick Look additionally blocks remote loads via a WKContentRuleList. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src markee-app:; style-src markee-app: 'unsafe-inline'; img-src markee-app: markee-doc: data: blob: https:; media-src markee-doc: https:; font-src markee-app: data:; connect-src markee-app: markee-doc:; frame-src 'none'; object-src 'none'; base-uri markee-doc:; form-action 'none'" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Markee Preview</title>

    <link rel="stylesheet" href="markee-app://app/theme.css" />
    <link rel="stylesheet" href="markee-app://app/vendor/highlight/github.min.css" id="hljs-light" />
    <link rel="stylesheet" href="markee-app://app/vendor/highlight/github-dark.min.css" id="hljs-dark" media="screen and (prefers-color-scheme: dark)" />
    <link rel="stylesheet" href="markee-app://app/vendor/katex/katex.min.css" />
    <style id="markee-user-css" media="screen"></style>

    <script src="markee-app://app/vendor/markdown-it/markdown-it.min.js"></script>
    <script src="markee-app://app/vendor/markdown-it/markdown-it-footnote.min.js"></script>
    <script src="markee-app://app/vendor/markdown-it/markdown-it-deflist.min.js"></script>
    <script src="markee-app://app/vendor/markdown-it/markdown-it-attrs.min.js"></script>
    <script src="markee-app://app/vendor/markdown-it/markdown-it-task-lists.min.js"></script>
    <script src="markee-app://app/vendor/highlight/highlight.min.js"></script>
    <script src="markee-app://app/vendor/katex/katex.min.js"></script>
    <script src="markee-app://app/vendor/katex/auto-render.min.js"></script>
</head>
<body>
    <article id="content" class="markdown-body"></article>
    <div id="toast" hidden></div>
    <script src="markee-app://app/util.js"></script>
    <script src="markee-app://app/render-core.js"></script>
    <script src="markee-app://app/reflow.js"></script>
    <script src="markee-app://app/app.js"></script>
</body>
</html>
