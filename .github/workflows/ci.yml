name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs when a PR is updated. Stale builds against an old
# commit aren't useful and burn CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: SwiftLint
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Lint
        run: swiftlint lint --strict Sources Tests

  build-test:
    name: Build + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Build across the current hosted macOS images (all Apple Silicon). The
    # macOS 13 floor (LSMinimumSystemVersion) is enforced at compile time, not
    # by the runner OS — building on a newer runner still targets macOS 13+.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15, macos-26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install just
        run: brew install just

      - name: Cache vendored JS/CSS
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: Resources/web/vendor
          key: vendor-${{ runner.os }}-${{ hashFiles('scripts/fetch-vendor.sh', 'scripts/vendor.sha256') }}

      - name: Fetch + verify vendor (downloads only what the cache lacks)
        run: just fetch-vendor

      - name: Show toolchain
        run: |
          xcode-select -p
          swift --version
          node --version

      - name: Test
        run: just test

      - name: Build app bundle
        run: just app

      - name: Verify bundle layout
        run: |
          test -x Markee.app/Contents/MacOS/Markee
          test -f Markee.app/Contents/Info.plist
          test -f Markee.app/Contents/Resources/LICENSE
          test -f Markee.app/Contents/Resources/THIRD-PARTY-NOTICES.md
          test -d Markee.app/Contents/Resources/web/vendor
          test -x Markee.app/Contents/PlugIns/QuickLookPreview.appex/Contents/MacOS/MarkeeQuickLookPreview
          test -x Markee.app/Contents/PlugIns/QuickLookThumbnail.appex/Contents/MacOS/MarkeeQuickLookThumbnail

      - name: Upload .app artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Markee.app-${{ matrix.os }}-${{ github.sha }}
          path: Markee.app
          if-no-files-found: error
